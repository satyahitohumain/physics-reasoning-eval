id: PHY-004
title: Point charge near an isolated neutral conducting sphere
domain: electromagnetism
difficulty: 3
statement: |
  A point charge $q$ is held at distance $d$ from the centre of an isolated, uncharged
  conducting sphere of radius $a < d$, in vacuum.

  Find the magnitude of the electrostatic force on the point charge in terms of $q$, $a$, $d$
  and $\varepsilon_0$. (It is attractive.)
answer:
  type: symbolic
  expr: q**2*a*(d/(d**2 - a**2)**2 - 1/d**3)/(4*pi*epsilon_0)
  symbols:
    q: {range: [0.1, 3]}
    a: {range: [0.1, 2]}
    d: {range: [0.2, 6]}
    epsilon_0: {range: [0.5, 2]}
  constraints: ["d - a"]
  units: {q: C, a: m, d: m, epsilon_0: F/m}
  answer_unit: N
  aliases: {eps0: epsilon_0, varepsilon_0: epsilon_0, epsilon0: epsilon_0}
solution_sketch: |
  The grounded-sphere image is $q' = -qa/d$ at $a^2/d$ from the centre. Neutrality requires
  an extra $+qa/d$ at the centre, which keeps the surface an equipotential.
  $F = \frac{q^2 a}{4\pi\varepsilon_0}\left[\frac{d}{(d^2-a^2)^2} - \frac{1}{d^3}\right]$.
  For $d \gg a$ this falls off as $2q^2a^3/(4\pi\varepsilon_0 d^5)$, the induced-dipole force.
rubric:
  - id: image
    points: 3
    criterion: Places the image charge $-qa/d$ at distance $a^2/d$ from the centre.
  - id: neutrality
    points: 3
    criterion: Adds a compensating charge $+qa/d$ at the centre so the sphere stays neutral (and justifies that the surface remains equipotential).
  - id: force
    points: 1
    criterion: Sums the Coulomb forces of both image charges with correct signs.
  - id: final
    points: 3
    auto: final_answer
    criterion: Final answer equivalent to the reference expression.
common_errors:
  - Solving the grounded-sphere problem instead (omitting the central charge), giving $q^2ad/(4\pi\varepsilon_0(d^2-a^2)^2)$.
  - Placing the central compensating charge with the wrong sign.
